name: Checks

# Lint, unit tests and course validation. All cheap: the screenshot tests and the Leckhampton acceptance test
# (which downloads LiDAR) run locally; see CONTRIBUTING.md.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript (lint, format, unit tests, courses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # the screenshot tests don't run here
      - run: npm run lint
      - run: npm run format:check
      - name: Unit tests and course validation
        run: npm test

  python:
    name: Python (course builder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: tools/requirements*.txt
      - name: Install
        run: pip install -r tools/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Builder tests
        run: pytest
      - name: Validate every course
        run: python -m tools.coursebuilder validate
