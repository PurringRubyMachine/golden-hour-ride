# Python tooling for the course builder in tools/. The ride itself needs no Python beyond a local web server.
# Setup: python3 -m venv .venv && .venv/bin/pip install -r tools/requirements-dev.txt

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# zip() over a list and its own tail (neighbouring points) is meant to stop at the shorter one
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
# rasterio's own use of an older affine API
filterwarnings = ["ignore:Use `@` matmul:PendingDeprecationWarning"]
